<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Quick check — Self Dispatch</title>
<!--
  The Self Dispatch app ships this same page inside itself and loads it under
  https://selfdispatch.net/ (so it works without this file); the hosted copy
  is a fallback and for tests. It runs before an email sign-up, sign-in or
  password reset. It shows Cloudflare Turnstile and hands
  the one-time token to the app (window.webkit.messageHandlers.turnstile).
  The site key comes from the app as ?sitekey= (it is public). Nothing is
  stored; outside the app the page only shows the widget.
-->
<style>
  :root { color-scheme: light dark; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:transparent; }
  body { min-height:72px; display:flex; align-items:center; justify-content:center; }
</style>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=sdTurnstileReady" async defer></script>
</head>
<body>
<div id="widget"></div>
<script>
  function sdPost(message) {
    try { window.webkit.messageHandlers.turnstile.postMessage(message); } catch (e) { /* not in the app */ }
  }
  function sdSiteKey() {
    var key = new URLSearchParams(window.location.search).get("sitekey") || "";
    return /^[A-Za-z0-9_-]{1,100}$/.test(key) ? key : "";
  }
  function sdTurnstileReady() {
    var key = sdSiteKey();
    if (!key) { sdPost({ error: "no_sitekey" }); return; }
    turnstile.render("#widget", {
      sitekey: key,
      theme: "auto",
      language: "en",
      callback: function (token) { sdPost({ token: token }); },
      "error-callback": function (code) { sdPost({ error: String(code || "error") }); return true; },
      "expired-callback": function () { sdPost({ expired: true }); },
      "timeout-callback": function () { sdPost({ error: "timeout" }); }
    });
  }
  // The script itself could not load (blocked or offline).
  window.addEventListener("load", function () {
    setTimeout(function () { if (typeof turnstile === "undefined") sdPost({ error: "script" }); }, 8000);
  });
</script>
</body>
</html>
